<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gifLib GIF converter</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2em; background: #0f172a; color: #f8fafc; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 2em; border-radius: 12px; border: 1px solid #334155; }
        .controls { background: #0f172a; padding: 1.5em; border-radius: 8px; display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
        input[type="file"] { flex-grow: 1; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #334155; padding: 12px; border-radius: 6px; text-align: center; color: #f8fafc; }
        .stat-card small {display: block; color: #94a3b8; font-size: 11px; text-transform: uppercase;}
        canvas { display: none; margin: 0 auto; border: 1px solid #3b82f6; max-width: 100%; height: auto; background: #000; }
        pre { background: #0f172a; color: #f8fafc; padding: 1.5em; border-radius: 8px; overflow-x: auto; font-size: 13px; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h2>gifLib converter</h2>

    <div class="controls">
        <input type="file" id="gifInput" accept="image/gif">
        <button id="processBtn">Process</button>
    </div>

    <div class="stats">
        <div class="stat-card"><small>Frame size</small><b id="sSize">-</b></div>
        <div class="stat-card"><small>Aspect ratio</small><b id="sAspect">-</b></div>
        <div class="stat-card"><small>Cols</small><b id="sCols">-</b></div>
        <div class="stat-card"><small>Fill perc</small><b id="sFill">-</b></div>
        <div class="stat-card"><small>Total frames</small><b id="sCount">-</b></div>
    </div>

    <canvas id="thecanvas"></canvas>

    <div id="outputArea" style="display:none; margin-top: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <b>Settings:</b>
            <a id="dlBtn" style="color:#4ade80; text-decoration:none; font-weight:bold;" href="#">📥 Download</a>
        </div>
        <pre id="copysettings"></pre>
    </div>
</div>




<script type="module">
    import { parseGIF, decompressFrames } from 'https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/+esm';

    const rtSize = 1024;

    document.getElementById('processBtn').addEventListener('click', async () => {
        const file = document.getElementById('gifInput').files[0];
        if (!file) return;

        const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
        const gif = parseGIF(await file.arrayBuffer());
        console.log(gif);
        const frames = decompressFrames(gif, true);
        const count = frames.length;
        const oW = frames[0].dims.width;
        const oH = frames[0].dims.height;
        const aspect = oH / oW;
        const div = gcd(oW, oH);
        const aspectText = `${oW / div}:${oH / div}`

        let best = { w: 0, h: 0, cols: 0, rows: 0, area: 0 };

        for (let c = 1; c <= count; c++) {
            let r = Math.ceil(count / c);
            
            let maxW_by_Width = rtSize / c;
            let maxW_by_Height = rtSize / (r * aspect);
            let W = Math.min(maxW_by_Width, maxW_by_Height);
            let H = W * aspect;

            if (W * H > best.area) {
                best = { w: W, h: H, cols: c, rows: r, area: W * H };
            }
        }

        const canvas = document.getElementById('thecanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.height = rtSize;
        canvas.style.display = 'block';
        ctx.clearRect(0, 0, rtSize, rtSize);

        const accum = document.createElement('canvas');
        accum.width = oW; accum.height = oH;
        const aCtx = accum.getContext('2d');
        const temp = document.createElement('canvas');
        const tCtx = temp.getContext('2d');

        frames.forEach((f, i) => {
            if (f.disposalType === 2) aCtx.clearRect(0, 0, oW, oH);
            temp.width = f.dims.width; temp.height = f.dims.height;
            tCtx.putImageData(new ImageData(new Uint8ClampedArray(f.patch), f.dims.width, f.dims.height), 0, 0);
            aCtx.drawImage(temp, f.dims.left, f.dims.top);

            const x = (i % best.cols) * best.w;
            const y = Math.floor(i / best.cols) * best.h;
            ctx.drawImage(accum, 0, 0, oW, oH, x, y, best.w, best.h);
        });

        document.getElementById('sSize').textContent = `${Math.floor(best.w)}x${Math.floor(best.h)}`;
        document.getElementById('sCols').textContent = best.cols;
        document.getElementById('sAspect').textContent = aspectText;
        document.getElementById('sCount').textContent = count;
        document.getElementById('sFill').textContent = Math.round((best.area * count) / (rtSize * rtSize) * 100) + "%";

        const delays = frames.map(frame => frame.delay);
        const totalDelay = delays.reduce((sum, d) => sum + d, 0);
        const avgDelay = totalDelay / delays.length;
        const avgFps = 1000 / avgDelay;
        document.getElementById('outputArea').style.display = 'block';
        document.getElementById('copysettings').textContent = `local gif = gifLib.GIF("URL", ${best.w}, ${best.h}, ${best.cols}, ${count}, ${avgFps})`;
        document.getElementById('dlBtn').href = canvas.toDataURL();
        document.getElementById('dlBtn').download = `${file.name}_converted.png`;
    });
</script>
</body>
</html>
